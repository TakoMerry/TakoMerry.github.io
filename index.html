    <!DOCTYPE html>
<html>
<head>
    <title>ネオンカラーの文字</title>
    <style>
        body {
            /* ネオンを目立たせるために背景を暗くします */
            background-color: #1a1a1a; 
            text-align: center; /* 文字を中央寄せ */
            padding-top: 100px;
        }

        /* ネオン効果を適用する要素のスタイル */
        .neon-text {
            /* ① 基本の文字色（ネオンの中心の色） */
            color: #fff; 
            font-size: 3rem;
            font-family:　'Kiwi Maru', serif;
            font-weight: bold;
            text-transform: uppercase;
            
            /* ② text-shadowでネオン効果を作成 */
            /* 影のx軸オフセット y軸オフセット ぼかし半径 影の色 */
            text-shadow: 
                0 0 7px #fff,       /* 小さく白い光の中心 */
                0 0 10px #00e7ff,    /* 明るい水色に少しぼかし */
                0 0 21px #00e7ff,    /* さらに水色を広げる */
                0 0 42px #00e7ff,    /* 広い範囲の青い光 */
                0 0 82px #00e7ff,
                0 0 92px #00e7ff,
                0 0 102px #00e7ff,
                0 0 151px #00e7ff;
        }
    </style>
</head>
<body>
    <div class="neon-text">市川市の魅力！！</div>
    <div style="color: white; margin-top: 20px;">CSSのtext-shadowでネオン効果を付けています。</div>
</body>
</html>
    

    <h1>市川市って何があるの？</h1>
    <p>1.大慶園</p>
    
    <p>2.市川動植物園</p>
    <p>住所　千葉県市川市大町２８４‐１</p>
    <p>いろいろあるよ！！</p>
    
    <p>3.ありのみコース</p>
    <p>4.葛飾八幡宮</p>
    <p>5.コルトンプラザ</p>
    <p>6.ラウンドワン</p>

</body>
</html>
